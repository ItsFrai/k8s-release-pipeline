name: CI - Lint, Build & Trivy Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint & Template Helm Chart
        run: |
          helm lint charts/release-app
          helm template release-app charts/release-app > /dev/null

      - name: Build Docker Image
        run: docker build -t release-app:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: release-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL