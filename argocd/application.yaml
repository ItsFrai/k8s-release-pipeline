apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ItsFrai/k8s-release-pipeline.git
    targetRevision: HEAD
    path: charts/release-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true